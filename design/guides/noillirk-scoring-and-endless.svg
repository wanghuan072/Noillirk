<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660"><rect width="900" height="660" rx="24" fill="#123c3b"/><g font-family="Segoe UI,Arial,sans-serif" font-weight="600"><text x="48" y="63" font-size="23" fill="#d7e8da">NOILLIRK / RESULTS AND SURVIVAL</text><text x="48" y="128" font-size="43" fill="#fff">Read two different signals</text><rect x="48" y="180" width="804" height="180" rx="20" fill="#d7e8da"/><text x="78" y="233" font-size="27" fill="#123c3b">POINTS</text><text x="78" y="309" font-size="43" fill="#123c3b">4 → 8 → 16 → 32 → 64 → 100</text><rect x="48" y="386" width="804" height="186" rx="20" fill="#fff"/><text x="78" y="440" font-size="27" fill="#123c3b">ENDLESS BALLOONS</text><text x="78" y="493" font-size="34" fill="#123c3b">Accepted: keep · Miss: lose one</text><text x="78" y="541" font-size="32" fill="#123c3b">Sky High: restore one, up to three</text><text x="48" y="619" font-size="27" fill="#d7e8da">A low accepted score can still save the run.</text></g></svg>