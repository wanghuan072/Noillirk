<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660"><rect width="900" height="660" rx="24" fill="#e6eee4"/><g font-family="Segoe UI,Arial,sans-serif" font-weight="600"><text x="48" y="63" font-size="23" fill="#49615c">PRACTICE / NOT A LIVE ANSWER BOARD</text><text x="48" y="128" font-size="43" fill="#123c3b">Something you take to the beach</text><rect x="48" y="185" width="804" height="154" rx="20" fill="#fff"/><text x="78" y="239" font-size="37" fill="#123c3b">TOWEL</text><text x="78" y="297" font-size="33" fill="#123c3b">An object you can pack and carry.</text><rect x="48" y="365" width="804" height="154" rx="20" fill="#fff0da"/><text x="78" y="420" font-size="37" fill="#123c3b">SUNNY</text><text x="78" y="478" font-size="32" fill="#123c3b">Weather, rather than a carried object.</text><text x="48" y="594" font-size="30" fill="#123c3b">Check the requested kind of answer first.</text><text x="48" y="633" font-size="23" fill="#123c3b">No acceptance or rank is promised for this exercise.</text></g></svg>