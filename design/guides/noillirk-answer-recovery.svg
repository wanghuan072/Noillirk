<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660"><rect width="900" height="660" rx="24" fill="#e6eee4"/><g font-family="Segoe UI,Arial,sans-serif" font-weight="600"><text x="48" y="63" font-size="23" fill="#49615c">AFTER SUBMITTING / CHOOSE THE NEXT ACTION</text><text x="48" y="128" font-size="43" fill="#123c3b">Read the state before you act</text><rect x="48" y="180" width="804" height="128" rx="20" fill="#fff0da"/><text x="78" y="229" font-size="33" fill="#123c3b">Refused + time left</text><text x="78" y="277" font-size="31" fill="#123c3b">Change the answer; try one clear fit.</text><rect x="48" y="325" width="804" height="128" rx="20" fill="#fff"/><text x="78" y="374" font-size="33" fill="#123c3b">Accepted + tier shown</text><text x="78" y="422" font-size="31" fill="#123c3b">Read the result; this prompt is finished.</text><rect x="48" y="470" width="804" height="128" rx="20" fill="#fff"/><text x="78" y="519" font-size="33" fill="#123c3b">Time ended / No Lift</text><text x="78" y="567" font-size="31" fill="#123c3b">Review the miss; advance to the next.</text></g></svg>